name: Build Libraries
on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: build-libs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build All Libraries
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global pull.rebase true
          git config --global core.autocrlf false

      - name: Enable Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: |
          choco install ninja
          ninja --version

      - name: (L) patches
        run: python Telegram/build/prepare/prepare.py patches qt6

      - name: (L) msys64
        run: python Telegram/build/prepare/prepare.py msys64 qt6

      - name: (L) python
        run: python Telegram/build/prepare/prepare.py python qt6

      - name: (L) NuGet
        run: python Telegram/build/prepare/prepare.py NuGet qt6

      - name: (L) jom
        run: python Telegram/build/prepare/prepare.py jom qt6

      - name: (L) gyp
        run: python Telegram/build/prepare/prepare.py gyp qt6

      - name: (L) gas-preprocessor
        run: python Telegram/build/prepare/prepare.py gas-preprocessor qt6

      # SKIP ALL LIBRARIES (ALREADY BUILT AND IN REPO)
      # - name: (L) lzma ...

      - name: (L) qt_6.11.0
        run: |
          python Telegram/build/prepare/prepare.py qt_6.11.0 qt6
          git add Libraries/win64/Qt-6.11.0
          git diff --quiet --staged || (git commit -m "Sync qt_6.11.0 artifacts" && git push)

      - name: (L) tg_owt
        run: |
          python Telegram/build/prepare/prepare.py tg_owt qt6
          git add Libraries/win64/tg_owt
          git diff --quiet --staged || (git commit -m "Sync tg_owt artifacts" && git push)

      - name: (L) ada
        run: python Telegram/build/prepare/prepare.py ada qt6

      - name: (L) protobuf
        run: python Telegram/build/prepare/prepare.py protobuf qt6

      - name: (L) tde2e
        run: python Telegram/build/prepare/prepare.py tde2e qt6
