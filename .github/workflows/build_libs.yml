      # - name: (L) nv-codec-headers
      #   run: python Telegram/build/prepare/prepare.py nv-codec-headers qt6

      # - name: (L) regex
      #   run: python Telegram/build/prepare/prepare.py regex qt6

      - name: (L) ffmpeg
        run: python Telegram/build/prepare/prepare.py ffmpeg qt6

      - name: (L) openal-soft
        run: python Telegram/build/prepare/prepare.py openal-soft qt6

      - name: (L) breakpad
